<!DOCTYPE html>
<html>
<head>
  <title>WebSocket Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1e1e1e; color: #d4d4d4; font-family: Consolas, monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; }

    #status-bar { padding: 6px 12px; font-size: 12px; background: #2d2d2d; border-bottom: 1px solid #3a3a3a; }
    #status { font-weight: bold; }
    #status.connected { color: #4ec94e; }
    #status.disconnected { color: #f44747; }
    #status.connecting { color: #e5c07b; }

    #main { display: flex; flex: 1; overflow: hidden; }

    #messages { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column-reverse; }

    .msg { padding: 5px 8px; margin-bottom: 4px; border-left: 3px solid #569cd6; background: #252526; border-radius: 2px; word-break: break-all; }
    .msg .time { color: #858585; font-size: 11px; margin-bottom: 2px; }
    .msg .data { color: #9cdcfe; white-space: pre; }

    #stats-panel { width: 200px; border-left: 1px solid #3a3a3a; background: #252526; overflow-y: auto; padding: 8px; }
    #stats-panel h3 { font-size: 11px; color: #858585; text-transform: uppercase; margin-bottom: 8px; }
    .stat-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #2d2d2d; font-size: 12px; }
    .stat-row .tname { color: #ce9178; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
    .stat-row .tcount { color: #4ec94e; margin-left: 6px; flex-shrink: 0; }
    .stat-row.has-diffs .tcount { color: #f44747; }
  </style>
</head>
<body>

  <div id="status-bar">● <span id="status" class="connecting">Connecting to ws://localhost:5123/ws/...</span></div>
  <div id="main">
    <div id="messages"></div>
    <div id="stats-panel">
      <h3>Table Stats</h3>
      <div id="stats"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const messagesEl = document.getElementById('messages');
    const statsEl = document.getElementById('stats');
    const tableStats = {};

    function setStatus(text, cls) {
      statusEl.textContent = text;
      statusEl.className = cls;
    }

    function addMessage(data) {
      const div = document.createElement('div');
      div.className = 'msg';
      const time = new Date().toLocaleTimeString();
      let display, parsed;
      try {
        parsed = JSON.parse(data);
        display = escapeHtml(JSON.stringify(parsed, null, 2));
      } catch {
        display = escapeHtml(data);
      }
      div.innerHTML = `<div class="time">${time}</div><div class="data">${display}</div>`;
      messagesEl.prepend(div);

      // Update stats if message contains a table name
      if (Array.isArray(parsed)) {
        const tableIdx = parsed.indexOf('table');
        if (tableIdx !== -1) {
          const tableName = parsed[tableIdx + 1];
          const rowCountIdx = parsed.indexOf('rowCount');
          const rowCount = rowCountIdx !== -1 ? parsed[rowCountIdx + 1] : 0;
          const diffsIdx = parsed.indexOf('rowDiffs');
          const hasDiffs = diffsIdx !== -1 && parsed[diffsIdx + 1].length > 0;
          updateStats(tableName, rowCount, hasDiffs);
          // Only show message if there are actual diffs
          if (!hasDiffs) return;
        }
      }
    }

    function updateStats(tableName, rowCount, hasDiffs) {
      if (!tableStats[tableName]) tableStats[tableName] = { rows: 0, diffs: 0 };
      tableStats[tableName].rows += rowCount;
      if (hasDiffs) tableStats[tableName].diffs++;
      renderStats();
    }

    function renderStats() {
      statsEl.innerHTML = Object.entries(tableStats).map(([name, s]) => `
        <div class="stat-row ${s.diffs > 0 ? 'has-diffs' : ''}" title="${name}">
          <span class="tname">${name}</span>
          <span class="tcount">${s.diffs > 0 ? '⚠ ' : '✓ '}${s.rows} rows</span>
        </div>`).join('');
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function connect() {
      setStatus('Connecting to ws://localhost:5123/ws/...', 'connecting');
      const ws = new WebSocket('ws://localhost:5123/ws/');

      ws.onopen = () => setStatus('Connected to ws://localhost:5123/ws/', 'connected');
    ws.onmessage = e => {
	  console.log(e.data);  // add this
      let parsed;
      try { parsed = JSON.parse(e.data); } catch { parsed = null; }

      // Handle table stats messages
      if (parsed && Array.isArray(parsed)) {
        const tableIdx = parsed.indexOf('table');
        if (tableIdx !== -1) {
          const tableName = parsed[tableIdx + 1];
          const rowCountIdx = parsed.indexOf('rowCount');
          const rowCount = rowCountIdx !== -1 ? parsed[rowCountIdx + 1] : 0;
          const diffsIdx = parsed.indexOf('rowDiffs');
          const hasDiffs = diffsIdx !== -1 && Array.isArray(parsed[diffsIdx + 1]) && parsed[diffsIdx + 1].length > 0;
          updateStats(tableName, rowCount, hasDiffs);
          if (!hasDiffs) return; // suppress display if no diffs
        }
      }

      // Display message
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML = `<div class="time">${new Date().toLocaleTimeString()}</div>` +
                      `<div class="data">${escapeHtml(parsed ? JSON.stringify(parsed, null, 2) : e.data)}</div>`;
      messagesEl.prepend(div);
    };
      ws.onclose = () => {
        setStatus('Disconnected — retrying in 3s...', 'disconnected');
        setTimeout(connect, 3000);
      };
      ws.onerror = () => ws.close();
    }

    connect();
  </script>
</body>
</html>
