        <h2><span class="span_2">5.8 </span>View menu</h2>
        <p>The <i>View menu</i> allows you to choose which features of the user interface are displayed. Features that can be switched on or off are the <i>Start pane</i>, <i>Navigator window</i>, <i>Status panel</i>, <i>Remarks window</i> and <i>Status bar</i>.</p>
