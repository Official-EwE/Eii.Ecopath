        <h2><a name="_Windows_menu"></a><a name="_Toc177320766"></a><span class="span_4">5.11 <![CDATA[ ]]></span>Windows menu</h2>
        <p>Use the Windows menu to choose which open Tab is displayed on the Main Screen (Tabs are originally opened using the Navigator pane). You can close all currently open Tabs and the contents of the Navigator pane using the Close All Tabs option.</p>
