name: Build & Upload assets on Release

on:
  release:
    types: [published]   # run after publishing a release

    
jobs:
  build-and-upload:
    runs-on: windows-latest
    permissions:
      contents: write        # required to upload assets to the release
      packages: read

    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # --- Installeer Inno Setup CLI ---
      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Derive Version/FileVersion from tag
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $semver = $tag.TrimStart('v')         # e.g. v1.2.3 -> 1.2.3
          $filever = ($semver -match '^\d+\.\d+\.\d+$') ? "$semver.0" : $semver
          "SEMVER=$semver" | Out-File $env:GITHUB_ENV -Append
          "FILEVER=$filever" | Out-File $env:GITHUB_ENV -Append

      # Ensure that the github-Official-EwE NuGet source is configured. The standard GITHUB_TOKEN is used. It's automatically created by GitHub Actions and is available as 'github.toke'
      # So you don't have to pass it to this action explicitly. (because 'secrets', and subsequently 'secrets.GITHUB_TOKEN' is not accessible in reusable workflows)
      - name: Ensure github-Official-EwE NuGet source
        run: |
          if (dotnet nuget list source | Select-String "github-Official-EwE") {
            dotnet nuget remove source github-Official-EwE
          }
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name "github-Official-EwE" `
            --username ${{ github.repository_owner }} `
            --password ${{ github.token }} `
            --store-password-in-clear-text
        shell: pwsh
  
      - name: Restore
        run: dotnet restore .\Sources\EwE6.sln

      # --- Build x86 (32-bit) ---
      - name: Build Release x86 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ env.SEMVER }} /p:FileVersion=${{ env.FILEVER }} /p:Platform=x86

      # --- Build x64 (64-bit) ---
      - name: Build Release x64 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ env.SEMVER }} /p:FileVersion=${{ env.FILEVER }} /p:Platform=x64

      # --- Build Installer x86 ---
      - name: Build Inno Setup Installer (x86)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $isccPath /DFileVersion="${{ env.FILEVER }}" /DCompile64Bit="0" "Deployment\EwE6_relpath.iss"
          
      # --- Build Installer x64 ---
      - name: Build Inno Setup Installer (x64)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $isccPath /DFileVersion="${{ env.FILEVER }}" /DCompile64Bit="1" "Deployment\EwE6_relpath.iss"

      # --- Package build outputs (ZIP) ---
      - name: Package build outputs
        shell: pwsh
        run: |
          $zipName = "Eii.Ecopath-${{ env.SEMVER }}.zip"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          # Collect all bin\Release outputs across projects (adjust if needed)
          $tmp = Join-Path $PWD "artifacts_tmp"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Get-ChildItem -Recurse -Directory | Where-Object { $_.FullName -match '\\bin\\Release$' } |
            ForEach-Object { Copy-Item "$($_.FullName)\*" -Destination $tmp -Recurse -Force }
          Compress-Archive -Path "$tmp\*" -DestinationPath "artifacts\$zipName"
          Remove-Item $tmp -Recurse -Force
          "ZIP_PATH=artifacts/$zipName" | Out-File $env:GITHUB_ENV -Append

      # --- Move installers to artifacts folder ---
      - name: Collect installer files
        shell: pwsh
        run: |
          # Inno Setup outputs to Deployment\Output by default
          $outputDir = "Deployment\Output"
          if (Test-Path $outputDir) {
            Move-Item "$outputDir\*.exe" -Destination "artifacts\" -Force
          }
          
          # Find the installer files
          $installer32 = Get-ChildItem "artifacts\*_32-bit_setup.exe" | Select-Object -First 1
          $installer64 = Get-ChildItem "artifacts\*_64-bit_setup.exe" | Select-Object -First 1
          
          if ($installer32) {
            "INSTALLER_X86_PATH=$($installer32.FullName)" | Out-File $env:GITHUB_ENV -Append
            "INSTALLER_X86_NAME=$($installer32.Name)" | Out-File $env:GITHUB_ENV -Append
          }
          if ($installer64) {
            "INSTALLER_X64_PATH=$($installer64.FullName)" | Out-File $env:GITHUB_ENV -Append
            "INSTALLER_X64_NAME=$($installer64.Name)" | Out-File $env:GITHUB_ENV -Append
          }

      # --- Upload assets to release ---
      - name: Upload ZIP to release
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.ZIP_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x86 installer to release
        if: env.INSTALLER_X86_PATH != ''
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.INSTALLER_X86_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload x64 installer to release
        if: env.INSTALLER_X64_PATH != ''
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ env.INSTALLER_X64_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
