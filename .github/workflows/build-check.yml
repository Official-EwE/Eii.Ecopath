name: Build Check
on:
  push:
    branches:
      - Upgrade_To_SDK_Style

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Authenticate to github-Official-EwE Packages
        run: |
          dotnet nuget update source "github-Official-EwE" `
            --username "${{ github.repository_owner }}" `
            --password "${{ secrets.GITHUB_TOKEN }}" `
            --store-password-in-clear-text
        shell: pwsh

      - name: Use custom NuGet build check action
        uses: Official-EwE/Eii.GithubActions/BuildCheckNet48Net80@master    # can also be BuildCheckNet48Net80@v.. etcc
        with:
          solution-file: ./Sources/EwE6.sln
