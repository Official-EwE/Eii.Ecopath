name: Release NuGet Package EwEUtils, EwEPlugin, EwECore, and create EwE6 installer
on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Framework targeting pack
        run: choco install netfx-4.8-devpack -y
        shell: pwsh

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.4.0'

      - name: Cache NuGet packages        # Try to find if a build cached packages. Maybe the build_check. This saves time
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
              nuget-${{ runner.os }}-

      - name: Cache build output      # Try to find if a build cached comiled files. Maybe the build_check. This saves time
        uses: actions/cache@v4
        with:
          path: |
              **/bin
              **/obj
          key: build-${{ runner.os }}-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
              build-${{ runner.os }}-

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          overrideConfig: |
              workflow=TrunkBased/preview1
              commit-message-incrementing=Enabled
              tag-prefix=v
              increment=Patch

      - name: Show extracted version
        run: echo "Version is ${{ steps.gitversion.outputs.SemVer }}"
        shell: pwsh


      # Ensure that the github-Official-EwE NuGet source is configured. The standard GITHUB_TOKEN is used. It's automatically created by GitHub Actions and is available as 'github.toke'
      # So you don't have to pass it to this action explicitly. (because 'secrets', and subsequently 'secrets.GITHUB_TOKEN' is not accessible in reusable workflows)
      - name: Ensure github-Official-EwE NuGet source
        run: |
          if (dotnet nuget list source | Select-String "github-Official-EwE") {
              dotnet nuget remove source github-Official-EwE
          }
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
              --name "github-Official-EwE" `
              --username ${{ github.actor }} `
              --password ${{ github.token }} `
              --store-password-in-clear-text
        shell: pwsh

      - name: List NuGet data sources
        run: dotnet nuget list source --format detailed
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore .\Sources\EwE6.sln
        shell: pwsh

      # Pack in dependency order: EwEUtils -> EwEPlugin -> EwECore
      - name: Pack EwEUtils NuGet package
        run: |
          dotnet pack Sources/EwEUtils/EwEUtils.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ steps.gitversion.outputs.SemVer }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: Pack EwEPlugin NuGet package
        run: |
          dotnet pack Sources/EwEPlugin/EwEPlugin.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ steps.gitversion.outputs.SemVer }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: Pack EwECore NuGet package
        run: |
          dotnet pack Sources/EwECore/EwECore.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ steps.gitversion.outputs.SemVer }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: List NuGet output files
        run: dir ./nuget
        shell: pwsh

      - name: Publish to GitHub Packages
        run: |
          Get-ChildItem -Path ./nuget -Filter *.symbols.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source "github-Official-EwE" --api-key ${{ github.token }} --skip-duplicate
          }
        shell: pwsh
        
      # --- Build x86 (32-bit) ---
      - name: Build Release x86 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ steps.gitversion.outputs.SemVer }} /p:FileVersion=${{ steps.gitversion.outputs.SemVer }} /p:Platform=x86 /p:UseProjectReferences=true

      # --- Build x64 (64-bit) ---
      - name: Build Release x64 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ steps.gitversion.outputs.SemVer }} /p:FileVersion=${{ steps.gitversion.outputs.SemVer }} /p:Platform=x64 /p:UseProjectReferences=true

      # --- Create artifacts directory ---
      - name: Create artifacts directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      # --- Build Installer x86 ---
      - name: Build Inno Setup Installer (x86)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outputDir = Join-Path $PWD "artifacts"
          & $isccPath /DSemVersion="${{ steps.gitversion.outputs.SemVer }}" /DCompile64Bit="0" /O"$outputDir" "Deployment\EwE6_relpath.iss"
          
      # --- Build Installer x64 ---
      - name: Build Inno Setup Installer (x64)
        shell: pwsh
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outputDir = Join-Path $PWD "artifacts"
          & $isccPath /DSemVersion="${{ steps.gitversion.outputs.SemVer }}" /DCompile64Bit="1" /O"$outputDir" "Deployment\EwE6_relpath.iss"

      # --- Set installer paths ---
      - name: Set installer paths
        shell: pwsh
        run: |
          $installer32 = Get-ChildItem "artifacts\*_32-bit_setup.exe" | Select-Object -First 1
          $installer64 = Get-ChildItem "artifacts\*_64-bit_setup.exe" | Select-Object -First 1
          
          if ($installer32) {
            "INSTALLER_X86_PATH=$($installer32.FullName)" | Out-File $env:GITHUB_ENV -Append
          }
          if ($installer64) {
            "INSTALLER_X64_PATH=$($installer64.FullName)" | Out-File $env:GITHUB_ENV -Append
          }

      # --- Upload assets to release ---
      - name: Upload x86 installer to release
        if: env.INSTALLER_X86_PATH != ''
        run: gh release upload "${{ steps.gitversion.outputs.SemVer }}" "${{ env.INSTALLER_X86_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload x64 installer to release
        if: env.INSTALLER_X64_PATH != ''
        run: gh release upload "${{ steps.gitversion.outputs.SemVer }}" "${{ env.INSTALLER_X64_PATH }}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
