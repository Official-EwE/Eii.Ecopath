
name: Release NuGet Package EwEUtils, EwEPlugin, EwECore, and create EwE6 installer

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

jobs:
  # 1) VERSIONING
  version:
    name: Determine version with GitVersion
    runs-on: windows-latest
    outputs:
      semver: ${{ steps.out.outputs.semver }}
      prerelease: ${{ steps.out.outputs.prerelease }}
      tag: ${{ steps.out.outputs.tag }}
    steps:
      - name: Checkout code (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.1.0
        with:
          versionSpec: '6.4.0'

      - name: Run GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.1.0
        with:
          overrideConfig: |
            workflow=TrunkBased/preview1
            commit-message-incrementing=Enabled
            tag-prefix=v
            increment=Patch

      - name: Expose version outputs
        id: out
        shell: pwsh
        run: |
          "semver=${{ steps.gitversion.outputs.SemVer }}"        >> $env:GITHUB_OUTPUT
          "prerelease=${{ steps.gitversion.outputs.PreReleaseLabel }}" >> $env:GITHUB_OUTPUT
          "tag=v${{ steps.gitversion.outputs.SemVer }}"          >> $env:GITHUB_OUTPUT

      - name: Show extracted version
        run: echo "Version is ${{ steps.gitversion.outputs.SemVer }}"
        shell: pwsh

  # 2) BUILD AND PACK NUGET
  build-pack-nuget:
    name: Build and Pack NuGet packages (EwEUtils -> EwEPlugin -> EwECore -> ScientificInterfaceShared)
    runs-on: windows-latest
    needs: [version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Framework targeting pack (4.8)
        run: choco install netfx-4.8-devpack -y
        shell: pwsh

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache build output
        uses: actions/cache@v4
        with:
          path: |
            **/bin
            **/obj
          key: build-${{ runner.os }}-${{ hashFiles('**/*.vbproj') }}
          restore-keys: |
            build-${{ runner.os }}-

      # Moved here: ensure source BEFORE restore
      - name: Ensure github-Official-EwE NuGet source
        run: |
          if (dotnet nuget list source | Select-String "github-Official-EwE") {
            dotnet nuget remove source github-Official-EwE
          }
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name "github-Official-EwE" `
            --username ${{ github.actor }} `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text
        shell: pwsh

      - name: List NuGet data sources
        run: dotnet nuget list source --format detailed
        shell: pwsh

      - name: Restore dependencies
        run: dotnet restore .\Sources\EwE6.sln
        shell: pwsh

      - name: Pack EwEUtils
        run: |
          dotnet pack Sources/EwEUtils/EwEUtils.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ needs.version.outputs.semver }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: Pack EwEPlugin
        run: |
          dotnet pack Sources/EwEPlugin/EwEPlugin.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ needs.version.outputs.semver }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: Pack EwECore
        run: |
          dotnet pack Sources/EwECore/EwECore.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ needs.version.outputs.semver }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: Pack ScientificInterfaceShared
        run: |
          dotnet pack Sources/ScientificInterfaceShared/ScientificInterfaceShared.vbproj `
            --configuration Release `
            --output ./nuget `
            /p:PackageVersion=${{ needs.version.outputs.semver }} `
            /p:UseProjectReferences=false
        shell: pwsh

      - name: List NuGet output files
        run: dir ./nuget
        shell: pwsh

      - name: Upload NuGet packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./nuget/*.nupkg

  # 3) PUBLISH NUGET
  publish-nuget:
    name: Publish NuGet packages to GitHub Packages
    runs-on: windows-latest
    needs: [build-pack-nuget]
    steps:
      - name: Download NuGet packages artifact
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: nuget

      - name: Ensure github-Official-EwE NuGet source
        run: |
          if (dotnet nuget list source | Select-String "github-Official-EwE") {
            dotnet nuget remove source github-Official-EwE
          }
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" `
            --name "github-Official-EwE" `
            --username ${{ github.actor }} `
            --password ${{ secrets.GITHUB_TOKEN }} `
            --store-password-in-clear-text
        shell: pwsh

      - name: List NuGet data sources
        run: dotnet nuget list source --format detailed
        shell: pwsh

      - name: Publish packages (skip duplicates)
        run: |
          Get-ChildItem -Path ./nuget -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --source "github-Official-EwE" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }
        shell: pwsh

  # 4) BUILD INSTALLERS
  build-installers:
    name: Build EwE6 (x86 and x64) and Inno Setup installers
    runs-on: windows-latest
    needs: [version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install .NET Framework targeting pack (4.8)
        run: choco install netfx-4.8-devpack -y
        shell: pwsh

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Build Release x86 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ needs.version.outputs.semver }} /p:FileVersion=${{ needs.version.outputs.semver }} /p:Platform=x86 /p:UseProjectReferences=true
        shell: pwsh

      - name: Build Release x64 with version
        run: dotnet build .\Sources\EwE6.sln -c Release /p:Version=${{ needs.version.outputs.semver }} /p:FileVersion=${{ needs.version.outputs.semver }} /p:Platform=x64 /p:UseProjectReferences=true
        shell: pwsh

      - name: Create artifacts directory
        run: New-Item -ItemType Directory -Force -Path artifacts | Out-Null
        shell: pwsh

      - name: Build Inno Setup Installer (x86)
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outputDir = Join-Path $PWD "artifacts"
          & $isccPath /DSemVersion="${{ needs.version.outputs.semver }}" /DCompile64Bit="0" /O"$outputDir" "Deployment\EwE6_relpath.iss"
        shell: pwsh

      - name: Build Inno Setup Installer (x64)
        run: |
          $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $outputDir = Join-Path $PWD "artifacts"
          & $isccPath /DSemVersion="${{ needs.version.outputs.semver }}" /DCompile64Bit="1" /O"$outputDir" "Deployment\EwE6_relpath.iss"
        shell: pwsh

      - name: List artifacts files
        run: dir .\artifacts
        shell: pwsh

      - name: Upload installers artifact
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            artifacts/*_32-bit_setup.exe
            artifacts/*_64-bit_setup.exe

  # 5) CREATE RELEASE
  release:
    name: Create or Update GitHub Release with auto notes
    runs-on: windows-latest
    needs: [version, build-installers]
    steps:
      - name: Download installers artifact
        uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers

      - name: Create GitHub Release with auto notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            installers/*_32-bit_setup.exe
            installers/*_64-bit_setup.exe
          prerelease: ${{ needs.version.outputs.prerelease != '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
