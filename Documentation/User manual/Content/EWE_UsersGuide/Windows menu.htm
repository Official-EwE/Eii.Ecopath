        <h2><span class="span_4">5.10     <![CDATA[ ]]></span>Windows menu</h2>
        <p>Use the <i>Windows menu</i> to choose which open tab is displayed on the <i>Main screen</i> (tabs are originally opened using the <i>Navigator window</i>). You can close individual tabs or all currently open tabs using the <i>Close</i> and <i>Close All</i> options.</p>
